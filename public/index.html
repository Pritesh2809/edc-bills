<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your Electricity Distribution Company bills easily">
    <title>EDC Bills Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>EDC Bills Manager</h1>
            <p class="subtitle">Track and manage your electricity bills</p>
        </header>

        <main class="main-content">
            <section class="add-bill-section">
                <h2>Add New Bill</h2>
                <form id="billForm" class="bill-form">
                    <div class="form-group">
                        <label for="billMonth">Billing Month</label>
                        <input type="month" id="billMonth" required>
                    </div>

                    <div class="form-group">
                        <label for="consumerNumber">Consumer Number</label>
                        <input type="text" id="consumerNumber" placeholder="e.g., 1234567890" required>
                    </div>

                    <div class="form-group">
                        <label for="unitsConsumed">Units Consumed (kWh)</label>
                        <input type="number" id="unitsConsumed" placeholder="e.g., 250" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="billAmount">Bill Amount ($)</label>
                        <input type="number" id="billAmount" placeholder="e.g., 75.50" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate" required>
                    </div>

                    <div class="form-group">
                        <label for="status">Payment Status</label>
                        <select id="status" required>
                            <option value="unpaid">Unpaid</option>
                            <option value="paid">Paid</option>
                            <option value="overdue">Overdue</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Bill</button>
                </form>
            </section>

            <section class="stats-section">
                <h2>Statistics</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Bills</h3>
                        <p class="stat-value" id="totalBills">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Amount</h3>
                        <p class="stat-value" id="totalAmount">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Unpaid Bills</h3>
                        <p class="stat-value" id="unpaidBills">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Avg. Consumption</h3>
                        <p class="stat-value" id="avgConsumption">0 kWh</p>
                    </div>
                </div>
            </section>

            <section class="bills-section">
                <div class="section-header">
                    <h2>All Bills</h2>
                    <div class="filter-controls">
                        <select id="filterStatus" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="paid">Paid</option>
                            <option value="unpaid">Unpaid</option>
                            <option value="overdue">Overdue</option>
                        </select>
                        <button id="clearAll" class="btn btn-secondary">Clear All</button>
                    </div>
                </div>

                <div id="billsList" class="bills-list">
                    <p class="empty-state">No bills added yet. Add your first bill above!</p>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>&copy; 2025 EDC Bills Manager. All rights reserved.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
